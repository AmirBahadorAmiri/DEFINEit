plugins {
    alias(libs.plugins.android.application)
    id 'androidx.room'
}

def versionMajor = 2
def versionMinor = 0
def versionPatch = 0

def generateVersionCode = {
    versionMajor * 10000 + versionMinor * 100 + versionPatch
}

def generateVersionName = {
    "${versionMajor}.${versionMinor}.${versionPatch}"
}

android {
    namespace = 'ir.DEFINEit'
    compileSdk 37

    buildFeatures {
        buildConfig = true
    }

    room {
        schemaDirectory "$projectDir/schemas"
    }

    defaultConfig {
        applicationId 'ir.DEFINEit'
        minSdk 26
        targetSdk 37
        versionCode generateVersionCode()
        versionName generateVersionName()

        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.12'

    def room_version = '2.8.4'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava3:$room_version"

    implementation 'com.squareup.okhttp3:okhttp:5.4.0'

    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'

    implementation("com.github.AmirBahadorAmiri:TelegramDialog:2.3.3")
    implementation("com.github.AmirBahadorAmiri:Logger:1.0.0")
    implementation("com.github.AmirBahadorAmiri:QShare:1.0.1")

}